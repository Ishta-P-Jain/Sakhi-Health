[alembic]
# path to migration scripts
script_location = alembic

# timezone to use when rendering the date
# within the migration file as well as the filename.
# string value is passed to dateutil.tz.gettz()
# leave blank for localtime
timezone = UTC
# max length of characters to apply to the
# version file name
# generated version file name will use this max length
# if left at default of 255, the name may exceed filesystem limits
# max_file_name_length = 255

# version location
# version_locations =

# the template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# the template used to generate migration files
# in the multi-db case
# file_template_multi = %%(rev)s_%%(slug)s_%%(db)s

# version code template
# version_code_template =

# the setting below implements which versioning system to use
# valid values are "timestamp" (uses a timestamp file) or "sequential"
# which uses sequential numbering based on the head revision
# versioning_system = sequential

# the setting below controls how alembic renders the
# sql that it emits to the console
# render_as_batch = false

# the setting below controls how alembic renders the
# sql that it emits to the console
# render_as_batch = true

# sqlalchemy.url = driver://user:pass@host/dbname
sqlalchemy.url = %(DATABASE_URL)s

# logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
